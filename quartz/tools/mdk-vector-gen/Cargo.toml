[package]
name = "mdk-vector-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to the exact OpenMLS fork + rev MDK builds against, with the
# `extensions-draft` feature that carries draft-ietf-mls-extensions
# `app_data_dictionary` / `app_components` / `app_data_update`. Marmot's current
# profile is defined in those terms, so vectors generated from stock crates.io
# openmls cannot exercise it. Keep this rev in lockstep with mdk's root
# Cargo.toml -- a drift here silently generates vectors for the wrong wire shape.
openmls = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["test-utils", "extensions-draft"] }
openmls_rust_crypto = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_basic_credential = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["test-utils"] }
openmls_memory_storage = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["persistence", "extensions-draft"] }
openmls_traits = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["extensions-draft"] }
tls_codec = "0.5"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
env_logger = "0.11"
secp256k1 = { version = "0.31", features = ["std", "global-context"] }
sha2 = "0.10"

[[bin]]
name = "mdk-vector-gen"
path = "src/main.rs"

[[bin]]
name = "marmot-profile-gen"
path = "src/marmot_profile_gen.rs"

[[bin]]
name = "emit-joiner-kp"
path = "src/emit_joiner_kp.rs"

[[bin]]
name = "verify-amethyst"
path = "src/verify_amethyst.rs"
