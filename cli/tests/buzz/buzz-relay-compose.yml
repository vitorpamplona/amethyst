# Backing services for buzz-relay-interop.sh: Postgres, Redis and MinIO on
# loopback ports 7510/7511/7512, data on tmpfs. Modelled on block/buzz's
# docker-compose.harness.yml (same images and credentials).
# Project name is set by the harness (`-p buzz-b-interop`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
    ports:
      - "127.0.0.1:${BUZZ_PG_PORT:-7510}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${BUZZ_REDIS_PORT:-7511}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The relay refuses to start unless its git object-store conformance probe
  # can write to S3, so MinIO (upstream's Silo build of it) is needed too.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    ports:
      - "127.0.0.1:${BUZZ_MINIO_PORT:-7512}:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 buzz_dev buzz_dev_secret &&
                  mc mb --ignore-existing local/buzz-media &&
                  mc anonymous set none local/buzz-media"
    restart: "no"
