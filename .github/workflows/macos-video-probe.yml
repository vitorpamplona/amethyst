name: macOS video probe

on:
  push:
    branches: [claude/gallant-tesla-p4mdyl]
    paths: [tools/macos-video-probe/**, .github/workflows/macos-video-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg
      - run: tools/macos-video-probe/run.sh
